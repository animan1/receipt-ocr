[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-ocr"
version = "0.1.0"
description = "Python library scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pillow>=10", "scikit-image>=0.26"]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.10"]
observe = ["onnxruntime>=1.23", "rapidocr==3.10.0"]

[project.scripts]
receipt-prepare-image = "receipt_ocr.prepare.cli:main"

[dependency-groups]
dev = ["mypy>=1.15", "opencv-python-headless>=4.10", "pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 100

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
